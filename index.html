function showBunker(){
    hideAll();d.bunkerView.style.display='block';
    var cats=[{n:'Инструменты',k:'tools',i:'🔧'},{n:'Книги',k:'books',i:'📚'},{n:'Артефакты',k:'artifacts',i:'🎨'},{n:'Медицина',k:'medicine',i:'💊'},{n:'Электроника',k:'electronics',i:'⚡'}];
    var html='';
    for(var i=0;i<cats.length;i++){
        var c=cats[i],catItems=[],bonus='';
        for(var j=0;j<ALL_ITEMS.length;j++){if(ALL_ITEMS[j].c===c.k&&s.shelfItems[ALL_ITEMS[j].n])catItems.push(ALL_ITEMS[j])}
        if(c.k==='tools'&&catItems.length>=3)bonus='🔓 Город';if(c.k==='electronics'&&catItems.length>=2)bonus='🔓 Завод';
        if(c.k==='medicine'&&catItems.length>=3)bonus='🔓 Лаборатория';if(c.k==='books'&&catItems.length>=3)bonus='🔓 Метро';
        html+='<div class="shelf-row" onclick="showCategory(\''+c.k+'\')"><div class="icon">'+c.i+'</div><div class="info"><div class="name">'+c.n+'</div><div class="count">'+catItems.length+' предметов';
        if(catItems.length>0){html+=' <span>';for(var k=0;k<Math.min(catItems.length,6);k++)html+=catItems[k].i;html+='</span>'}
        html+='</div></div>'+(bonus?'<div class="bonus">'+bonus+'</div>':'')+'</div>';
    }
    d.shelves.innerHTML=html;
    var upgNames={walls:'Стены',light:'Освещение',filter:'Фильтр',bed:'Койка'};
    var upgIcons={walls:'🧱',light:'💡',filter:'🌀',bed:'🛏️'};
    var uh='';for(var uk in s.upgrades){uh+='<span style="margin:4px;">'+upgIcons[uk]+' '+(s.upgrades[uk]||0)+'</span>'}
    d.upgradesSection.innerHTML='<p style="color:#888;font-size:10px;margin-top:10px;">🔨 Улучшения: '+uh+'</p>';
    upd();
}

function showCategory(catKey){
    var catNames={tools:'🔧 Инструменты',books:'📚 Книги',artifacts:'🎨 Артефакты',medicine:'💊 Медицина',electronics:'⚡ Электроника'};
    var catItems=[],notFound=[];
    for(var i=0;i<ALL_ITEMS.length;i++){if(ALL_ITEMS[i].c===catKey){if(s.shelfItems[ALL_ITEMS[i].n])catItems.push(ALL_ITEMS[i]);else notFound.push(ALL_ITEMS[i])}}
    var html='<h3 style="color:var(--accent);">'+catNames[catKey]+'</h3>';
    if(catItems.length>0){html+='<p style="color:var(--safe);">✅ Найдено: '+catItems.length+'</p>';for(var j=0;j<catItems.length;j++){var it=catItems[j];html+='<div class="shelf-row"><span>'+it.i+'</span><span style="color:'+(RARITY_COLORS[it.r]||'#fff')+';">'+it.n+'</span><span style="color:#888;font-size:9px;">'+RARITY_NAMES[it.r]+'</span></div>'}}
    if(notFound.length>0){html+='<p style="color:#888;">❓ Ещё не найдено: '+notFound.length+'</p>';for(var k=0;k<notFound.length;k++){html+='<div class="shelf-row" style="opacity:0.4;"><span>❓</span><span>???'+'</span><span style="color:#888;font-size:9px;">'+RARITY_NAMES[notFound[k].r]+'</span></div>'}}
    d.storyContent.innerHTML=html;d.storyPopup.querySelector('h3').textContent=catNames[catKey];d.storyPopup.classList.add('open');d.overlay.classList.add('show');
}

// ==================== КАРТА ====================
function showMap(){hideAll();d.mapView.style.display='block';var html='';for(var k in ZONES){var z=ZONES[k],unlocked=z.unlock(s),dangerBar='';for(var i=0;i<10;i++)dangerBar+=i<z.d?'█':'░';html+='<div class="zone-card'+(unlocked?'':' locked')+'" data-zone="'+k+'" '+(unlocked?'':'')+'><div class="zone-icon">'+z.i+'</div><div class="zone-info"><div class="zone-name">'+z.n+'</div><div class="zone-danger">Опасность: '+dangerBar+'</div><div style="font-size:9px;color:#888;">'+z.desc+'</div></div></div>'}d.zones.innerHTML=html;var cards=document.querySelectorAll('.zone-card:not(.locked)');for(var i=0;i<cards.length;i++)cards[i].onclick=function(){startSearch(this.dataset.zone)};upd()}

// ==================== ПОИСК ====================
function startSearch(zoneKey){
    if(s.food<=0){toast('❌ Нет еды!','#ff4444');return}if(s.searching)return;
    s.searching=true;s.currentZone=zoneKey;s.foundToday=[];s.food--;hideAll();d.searchView.style.display='block';
    d.searchTitle.textContent='🔍 Поиск: '+ZONES[zoneKey].n;d.progressFill.style.width='0%';d.foundItems.innerHTML='';
    var progress=0,totalTime=2000+Math.random()*2000;if(s.upgrades.light>=2)totalTime*=0.7;if(s.mountainSpeed)totalTime*=0.5;
    var interval=setInterval(function(){progress+=5;d.progressFill.style.width=Math.min(100,progress)+'%';if(progress>=100){clearInterval(interval);finishSearch(zoneKey)}},totalTime/20);
    upd()
}

function finishSearch(zoneKey){
    var z=ZONES[zoneKey],numFinds=2+Math.floor(Math.random()*4);if(s.dogActive)numFinds+=2;if(s.upgrades.filter>=1)numFinds+=1;if(s.factoryBonus)numFinds+=s.factoryBonus;
    var zoneItems=[];for(var i=0;i<ALL_ITEMS.length;i++){if(ALL_ITEMS[i].z===zoneKey)zoneItems.push(ALL_ITEMS[i])}
    for(var j=0;j<numFinds;j++){if(Math.random()<0.8&&zoneItems.length>0){var item=zoneItems[Math.floor(Math.random()*zoneItems.length)];s.inv[item.n]=(s.inv[item.n]||0)+1;if(!s.shelfItems[item.n]){s.shelfItems[item.n]=true;s.shelves[item.c]=(s.shelves[item.c]||0)+1;if(s.stories<1&&Object.keys(s.shelfItems).length>=5){s.stories=1;showStory(0)}}s.foundToday.push(item);s.coins+=item.p||1;s.totalFinds++;if(item.r==='legendary')s.hasLegendary=true;addFoundItem(item)}}
    var dmg=z.d;if(s.cityDanger)dmg-=s.cityDanger;if(s.upgrades.walls>=2)dmg-=2;if(Math.random()*10<Math.max(1,dmg)){s.health-=5+Math.floor(Math.random()*15);toast('⚠️ Опасно!','#ff4444')}
    checkZoneUnlocks();checkCardSets();if(Math.random()<0.3)triggerEvent();s.searching=false;s.day++;updTimeOfDay();
    setTimeout(function(){d.searchView.style.display='none';showBunker()},1500);upd()
}

function checkZoneUnlocks(){
    var unlocks={city:(s.shelves.tools||0)>=3,factory:(s.shelves.electronics||0)>=2,swamp:(s.shelves.medicine||0)>=2,mountains:(s.shelves.tools||0)>=6,metro:s.stories>=3,bunker_lab:(s.shelves.electronics||0)>=5&&(s.shelves.medicine||0)>=4,lab:(s.shelves.medicine||0)>=3,desert:(s.shelves.tools||0)>=8,port:(s.shelves.electronics||0)>=4,hospital:(s.shelves.medicine||0)>=5};
    for(var k in unlocks){if(unlocks[k]&&!s.zoneUnlocks[k]){s.zoneUnlocks[k]=true;toast('🔓 Открыта зона: '+ZONES[k].n+'!','#30c030')}}
    if((s.shelves.electronics||0)>=4&&!s.dogActive){s.dogActive=true;toast('🐕 Пёс проснулся!','#ffd700')}
}

function updTimeOfDay(){var t=['morning','day','evening','night'];s.timeOfDay=t[s.day%4]}
function addFoundItem(item){var div=document.createElement('span');div.className='found-item';div.style.color=RARITY_COLORS[item.r]||'#fff';div.textContent=item.i+' '+item.n;d.foundItems.appendChild(div)}

// ==================== ВЫЛАЗКИ ====================
var raidActive=false,raidFound=0,raidCells=[];
function startRaid(){if(s.food<2){toast('❌ Нужно 2 еды!','#ff4444');return}if(raidActive)return;s.food-=2;raidActive=true;raidFound=0;raidCells=[];hideAll();d.raidView.style.display='block';d.raidStatus.textContent='Кликай по клеткам!';d.raidGrid.innerHTML='';for(var i=0;i<9;i++){var hasItem=Math.random()<0.7,isTrap=!hasItem&&Math.random()<0.3;raidCells.push({hasItem:hasItem,isTrap:isTrap,opened:false});var cell=document.createElement('div');cell.className='raid-cell';cell.textContent='❓';cell.dataset.idx=i;cell.onclick=function(){openRaidCell(parseInt(this.dataset.idx),this)};d.raidGrid.appendChild(cell)}upd()}
function openRaidCell(idx,el){if(!raidActive||raidCells[idx].opened)return;raidCells[idx].opened=true;if(raidCells[idx].hasItem){var zoneItems=[];var zk=Object.keys(ZONES)[Math.floor(Math.random()*Object.keys(ZONES).length)];for(var i=0;i<ALL_ITEMS.length;i++){if(ALL_ITEMS[i].z===zk||Math.random()<0.3)zoneItems.push(ALL_ITEMS[i])}if(zoneItems.length>0){var it=zoneItems[Math.floor(Math.random()*zoneItems.length)];s.inv[it.n]=(s.inv[it.n]||0)+1;if(!s.shelfItems[it.n]){s.shelfItems[it.n]=true;s.shelves[it.c]=(s.shelves[it.c]||0)+1}s.totalFinds++;s.coins+=(it.p||1)*2;el.textContent=it.i;el.style.background='#0a1a0a';el.style.borderColor='var(--safe)';toast(it.i+' '+it.n+'!',RARITY_COLORS[it.r]||'#fff')}}else if(raidCells[idx].isTrap){s.health-=10;el.textContent='💥';el.style.background='#1a0a0a';el.style.borderColor='var(--danger)';toast('💥 Ловушка!','#ff4444')}else{el.textContent='💨';el.style.background='#111';toast('Пусто...','#888')}raidFound++;if(raidFound>=9||(raidFound>=5&&Math.random()<0.3)){setTimeout(function(){raidActive=false;d.raidView.style.display='none';showBunker();checkCardSets();upd()},1000)}upd()}
function checkCardSets(){if(!CARD_SETS)return;for(var i=0;i<CARD_SETS.length;i++){var cs=CARD_SETS[i];if(!s.cardSets[cs.name]){var zoneItems=[];for(var j=0;j<ALL_ITEMS.length;j++){if(ALL_ITEMS[j].z===cs.zone)zoneItems.push(ALL_ITEMS[j].n)}var allFound=true;for(var k=0;k<zoneItems.length;k++){if(!s.shelfItems[zoneItems[k]])allFound=false}if(allFound&&zoneItems.length>0){s.cardSets[cs.name]=true;cs.effect(s);toast('🃏 Сет: '+cs.icon+' '+cs.name+'! '+cs.bonus,cs.color)}}}}

// ==================== КОНЦОВКА ====================
var gameEnded=false;
function checkEnding(){if(gameEnded)return;var legendaryCount=0;for(var i=0;i<ALL_ITEMS.length;i++){if(ALL_ITEMS[i].r==='legendary'&&s.shelfItems[ALL_ITEMS[i].n])legendaryCount++}if(legendaryCount>=4&&!gameEnded){gameEnded=true;setTimeout(showEnding,2000)}}
function showEnding(){
    var panel=document.createElement('div');panel.className='panel-modal open';panel.style.cssText='z-index:500;max-width:500px;background:#0a0a0a;border:3px solid #ffd700;';
    panel.innerHTML='<h2 style="color:#ffd700;">🏁 ФИНАЛ</h2><p style="color:#ccc;font-style:italic;">Все легендарные предметы собраны. Бункер сияет.</p><p style="color:#aaa;font-size:11px;">Что дальше?</p><button class="btn accent" id="ending-stay" style="margin:5px;">🏠 Остаться</button><button class="btn" id="ending-leave" style="margin:5px;color:#ff9d00;">🚶 Уйти</button><button class="btn" id="ending-reset" style="margin:5px;color:#ff69b4;">💫 Новая игра+</button>';
    document.body.appendChild(panel);d.overlay.classList.add('show');
    document.getElementById('ending-stay').onclick=function(){panel.innerHTML='<h2 style="color:#ffd700;">🏠 ТЫ ОСТАЛСЯ</h2><p style="color:#ccc;">Бункер стал домом. Полки сияют.</p><p style="color:#aaa;">Конец.</p><button class="btn accent" onclick="location.reload()">Спасибо</button>'};
    document.getElementById('ending-leave').onclick=function(){panel.innerHTML='<h2 style="color:#ff9d00;">🚶 ТЫ УШЁЛ</h2><p style="color:#ccc;">Ты покинул бункер. Впереди — неизвестность.</p><p style="color:#aaa;">Конец.</p><button class="btn accent" onclick="location.reload()">Спасибо</button>'};
    document.getElementById('ending-reset').onclick=function(){s.prestige++;s.food=10;s.health=100;s.day=1;s.coins=100;s.zoneUnlocks={forest:true};for(var k in s.shelves)s.shelves[k]=0;s.shelfItems={};s.stories=0;s.dogActive=false;s.hasLegendary=false;s.cardSets={};s.upgrades={walls:0,light:0,filter:0,bed:0};s.totalFinds=0;gameEnded=false;panel.remove();d.overlay.classList.remove('show');toast('💫 Новая игра+! Бонус: 100 монет','#ff69b4');upd();showBunker()};
}

// ==================== СОБЫТИЯ ====================
function triggerEvent(){
    var events=[{t:'💰 Склад!',txt:'+10 еды и +50 монет!',fn:function(){s.food+=10;s.coins+=50}},{t:'⚠️ Мародёры!',txt:'Потеряно 5 здоровья.',fn:function(){s.health-=5}},{t:'🍀 Удача',txt:'+1 удача',fn:function(){s.luck+=1}},{t:'📦 Посылка',txt:'+3 предмета',fn:function(){for(var i=0;i<3;i++){var it=ALL_ITEMS[Math.floor(Math.random()*ALL_ITEMS.length)];s.inv[it.n]=(s.inv[it.n]||0)+1;if(!s.shelfItems[it.n]){s.shelfItems[it.n]=true;s.shelves[it.c]=(s.shelves[it.c]||0)+1}}}}];
    var ev=events[Math.floor(Math.random()*events.length)];ev.fn();d.eventTitle.textContent=ev.t;d.eventText.textContent=ev.txt;d.eventPopup.classList.add('open');d.overlay.classList.add('show')
}

// ==================== СТАТИСТИКА ====================
function showStats(){hideAll();d.statsView.style.display='block';var html='';html+='<div class="stat-row"><span>Всего найдено</span><span class="val">'+s.totalFinds+'</span></div>';html+='<div class="stat-row"><span>Дней прожито</span><span class="val">'+s.day+'</span></div>';html+='<div class="stat-row"><span>Монет</span><span class="val">'+s.coins+'</span></div>';html+='<div class="stat-row"><span>Предметов в коллекции</span><span class="val">'+Object.keys(s.shelfItems).length+'/'+ALL_ITEMS.length+'</span></div>';html+='<div class="stat-row"><span>Зон открыто</span><span class="val">'+Object.keys(s.zoneUnlocks).length+'/11</span></div>';html+='<div class="stat-row"><span>Крафтов</span><span class="val">'+s.craftsDone+'</span></div>';html+='<div class="stat-row"><span>Обменов</span><span class="val">'+s.tradesDone+'</span></div>';d.statsContent.innerHTML=html;var ahtml='';for(var i=0;i<ACHIEVEMENTS.length;i++){var a=ACHIEVEMENTS[i];if(!s.ach[a.id]&&a.ch(s)){s.ach[a.id]=true;toast('🏆 '+a.n+'!','#ffd700')}ahtml+='<div class="ach-row'+(s.ach[a.id]?' done':' locked')+'"><span>'+a.icon+'</span><div><b>'+a.n+'</b><div style="font-size:9px;color:#888;">'+a.d+'</div></div>'+(s.ach[a.id]?'<span style="color:var(--safe);">✅</span>':'')+'</div>'}d.achContent.innerHTML=ahtml;upd()}

// ==================== УЛУЧШЕНИЯ ====================
function showUpgrades(){var costs={walls:[50,150,300],light:[100,250,500],filter:[200,400,800],bed:[300,600,1000]};var names={walls:'Стены (+защита)',light:'Освещение (+скорость)',filter:'Фильтр (+находки)',bed:'Койка (+здоровье)'};var icons={walls:'🧱',light:'💡',filter:'🌀',bed:'🛏️'};var html='';for(var k in costs){var lvl=s.upgrades[k]||0,max=costs[k].length,canUp=lvl<max&&s.coins>=costs[k][lvl];html+='<div class="bunker-upgrade"><span>'+icons[k]+' '+names[k]+'</span><span>Ур.'+lvl+'/'+max+'</span><button data-key="'+k+'" '+(canUp?'':'disabled')+'>'+(lvl>=max?'Макс':costs[k][lvl]+'💰')+'</button></div>'}d.upgradesContent.innerHTML=html;d.upgradesPopup.classList.add('open');d.overlay.classList.add('show');var btns=document.querySelectorAll('#upgrades-content button:not([disabled])');for(var i=0;i<btns.length;i++)btns[i].onclick=function(){var k=this.dataset.key,lvl=s.upgrades[k]||0,cs={walls:[50,150,300],light:[100,250,500],filter:[200,400,800],bed:[300,600,1000]};var cost=cs[k]?cs[k][lvl]:50;if(s.coins>=cost){s.coins-=cost;s.upgrades[k]=(s.upgrades[k]||0)+1;s.upgradesDone++;toast('🔨 Улучшено!','#ffd700');upd();showUpgrades()}}}

// ==================== КРАФТ ====================
function showCraft(){var html='';for(var i=0;i<CRAFT_RECIPES.length;i++){var r=CRAFT_RECIPES[i],count=0;for(var j=0;j<ALL_ITEMS.length;j++){if(ALL_ITEMS[j].r===r.from)count+=(s.inv[ALL_ITEMS[j].n]||0)}var can=count>=r.need;html+='<div class="shelf-row"><span>'+r.desc+'</span><button class="btn accent" '+(can?'':'disabled')+' data-from="'+r.from+'" data-to="'+r.to+'" data-need="'+r.need+'">Создать</button></div>'}d.craftOptions.innerHTML=html;d.craftPopup.classList.add('open');d.overlay.classList.add('show');var btns=document.querySelectorAll('#craft-options button:not([disabled])');for(var i=0;i<btns.length;i++)btns[i].onclick=function(){doCraft(this.dataset.from,this.dataset.to,parseInt(this.dataset.need))}}
function doCraft(from,to,need){var removed=0;for(var i=0;i<ALL_ITEMS.length&&removed<need;i++){if(ALL_ITEMS[i].r===from&&(s.inv[ALL_ITEMS[i].n]||0)>0){var take=Math.min(s.inv[ALL_ITEMS[i].n],need-removed);s.inv[ALL_ITEMS[i].n]-=take;removed+=take;if(s.inv[ALL_ITEMS[i].n]<=0&&s.shelfItems[ALL_ITEMS[i].n]){s.shelfItems[ALL_ITEMS[i].n]=false;s.shelves[ALL_ITEMS[i].c]--}}}var targetItems=[];for(var j=0;j<ALL_ITEMS.length;j++){if(ALL_ITEMS[j].r===to)targetItems.push(ALL_ITEMS[j])}if(targetItems.length>0){var ni=targetItems[Math.floor(Math.random()*targetItems.length)];s.inv[ni.n]=(s.inv[ni.n]||0)+1;if(!s.shelfItems[ni.n]){s.shelfItems[ni.n]=true;s.shelves[ni.c]=(s.shelves[ni.c]||0)+1}s.craftsDone++;toast('🔧 '+ni.i+' '+ni.n+'!','#ffd700')}upd();showCraft()}

// ==================== ТОРГОВЛЯ ====================
function showTrade(){d.tradePopup.classList.add('open');d.overlay.classList.add('show')}
function doTrade(){var commonCount=0;for(var i=0;i<ALL_ITEMS.length;i++){if(ALL_ITEMS[i].r==='common')commonCount+=(s.inv[ALL_ITEMS[i].n]||0)}if(commonCount<5){toast('❌ Нужно 5 обычных','#ff4444');return}var removed=0;for(var j=0;j<ALL_ITEMS.length&&removed<5;j++){if(ALL_ITEMS[j].r==='common'&&(s.inv[ALL_ITEMS[j].n]||0)>0){var take=Math.min(s.inv[ALL_ITEMS[j].n],5-removed);s.inv[ALL_ITEMS[j].n]-=take;removed+=take;if(s.inv[ALL_ITEMS[j].n]<=0&&s.shelfItems[ALL_ITEMS[j].n]){s.shelfItems[ALL_ITEMS[j].n]=false;s.shelves[ALL_ITEMS[j].c]--}}}var uncommons=[];for(var k=0;k<ALL_ITEMS.length;k++){if(ALL_ITEMS[k].r==='uncommon')uncommons.push(ALL_ITEMS[k])}var ni=uncommons[Math.floor(Math.random()*uncommons.length)];s.inv[ni.n]=(s.inv[ni.n]||0)+1;if(!s.shelfItems[ni.n]){s.shelfItems[ni.n]=true;s.shelves[ni.c]=(s.shelves[ni.c]||0)+1}s.coins+=10;s.tradesDone++;toast('🤝 +'+ni.i+' '+ni.n,'#30c030');upd();closeTrade()}
function closeTrade(){d.tradePopup.classList.remove('open');d.overlay.classList.remove('show')}

// ==================== ЗАПИСКИ ====================
function showStory(idx){if(!idx)idx=Math.min(s.stories,STORIES.length-1);if(idx>=STORIES.length)return;var st=STORIES[idx];d.storyContent.innerHTML='<p style="color:var(--accent);font-weight:bold;">'+st.t+'</p><p style="color:#ccc;font-style:italic;">'+st.txt+'</p>';d.storyPopup.classList.add('open');d.overlay.classList.add('show')}

// ==================== БИНДИНГ ====================
document.getElementById('btn-bunker').addEventListener('click',showBunker);
document.getElementById('btn-map').addEventListener('click',showMap);
document.getElementById('btn-raid').addEventListener('click',startRaid);
document.getElementById('btn-stats').addEventListener('click',showStats);
document.getElementById('btn-upgrades').addEventListener('click',showUpgrades);
document.getElementById('btn-craft').addEventListener('click',showCraft);
document.getElementById('btn-trade').addEventListener('click',showTrade);
document.getElementById('btn-story').addEventListener('click',function(){showStory(Math.min(s.stories,STORIES.length-1))});
document.getElementById('event-ok').addEventListener('click',function(){d.eventPopup.classList.remove('open');d.overlay.classList.remove('show')});
document.getElementById('close-craft').addEventListener('click',function(){d.craftPopup.classList.remove('open');d.overlay.classList.remove('show')});
document.getElementById('close-trade').addEventListener('click',closeTrade);
document.getElementById('close-story').addEventListener('click',function(){d.storyPopup.classList.remove('open');d.overlay.classList.remove('show')});
document.getElementById('close-upgrades').addEventListener('click',function(){d.upgradesPopup.classList.remove('open');d.overlay.classList.remove('show')});
document.getElementById('do-trade').addEventListener('click',doTrade);
d.overlay.addEventListener('click',function(){d.eventPopup.classList.remove('open');d.craftPopup.classList.remove('open');d.tradePopup.classList.remove('open');d.storyPopup.classList.remove('open');d.upgradesPopup.classList.remove('open');d.overlay.classList.remove('show')});

// ==================== ИНИТ ====================
function init(){
    load();if(Object.keys(s.zoneUnlocks).length===0)s.zoneUnlocks={forest:true};
    showBunker();
    console.log('🏠 БУНКЕР v4.0 — 100+ предметов | 11 зон | Концовка | Вылазки | Сеты');
}
init();
</script>
</body>
</html>
