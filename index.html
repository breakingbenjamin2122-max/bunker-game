<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бункер Коллекционера</title>
    <style>
        body{background:#0d0d0d;color:#c8c8c8;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
        .container{text-align:center}
        h1{color:#ff8800}
        .btn{padding:15px 30px;background:#ff8800;color:#000;border:none;border-radius:25px;font-size:18px;cursor:pointer;margin:10px}
        .btn:hover{background:#ffaa00}
        #counter{font-size:48px;color:#ffd700;margin:20px}
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Бункер</h1>
        <p>Тестовая игра — кликай кнопку</p>
        <div id="counter">0</div>
        <button class="btn" onclick="clicked()">🔍 Искать предметы</button>
        <p style="color:#888;margin-top:20px;">Версия: <span id="ver">v1.0</span></p>
    </div>
    <script>
        var count = 0;
        function clicked(){
            count++;
            document.getElementById('counter').textContent = count;
        }
    </script>
</body>
</html>
