<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бункер Коллекционера v2.0</title>
    <style>
        body{background:#1a1a0a;color:#c8c8c8;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
        .container{text-align:center}
        h1{color:#ff8800}
        .btn{padding:15px 30px;background:#ff8800;color:#000;border:none;border-radius:25px;font-size:18px;cursor:pointer;margin:10px}
        .btn:hover{background:#ffaa00}
        #counter{font-size:48px;color:#ffd700;margin:20px}
        .found{color:#30c030;font-size:14px;margin:10px}
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Бункер v2.0</h1>
        <p>Найдено предметов:</p>
        <div id="counter">0</div>
        <button class="btn" onclick="clicked()">🔍 Искать предметы</button>
        <div id="last" class="found"></div>
        <p style="color:#888;margin-top:20px;">v2.0 — Авто-обновление работает!</p>
    </div>
    <script>
        var count = 0;
        var items = ['🌿 Ветка','🔩 Гвоздь','📖 Книга','💡 Лампа','🔑 Ключ'];
        function clicked(){
            count++;
            var item = items[Math.floor(Math.random()*items.length)];
            document.getElementById('counter').textContent = count;
            document.getElementById('last').textContent = 'Найдено: ' + item;
        }
    </script>
</body>
</html>
